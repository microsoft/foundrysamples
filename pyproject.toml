[project]
name = "microsoft-ai-python-samples"
version = "0.1.0"
description = "Python reference samples for Microsoft AI"
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.24.0,<2",
    "azure-identity-broker>=1.3.0,<2",
    "openai>=2.0.0,<3",
    "python-dotenv>=1.1.0,<2",
]

[dependency-groups]
dev = [
    "ipykernel>=6.30.0,<7",
    "ipywidgets>=8.1.0,<9",
    "pytest>=8.4.0,<9",
    "ruff>=0.12.0,<1",
    "tqdm>=4.67.0,<5",
]

[tool.pytest.ini_options]
addopts = "--strict-markers"

[tool.ruff]
line-length = 88
target-version = "py311"